* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fundo); color: var(--tinta); }
body { font-family: "Instrument Sans", system-ui, sans-serif; font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
.topo { background: var(--azul); color: var(--branco); padding: 18px 16px 14px; }
.topo .marca { display: flex; align-items: center; gap: 10px; }
.topo .marca img { width: 34px; height: 34px; border-radius: 6px; background: var(--branco); padding: 3px; }
.topo .eyebrow { font-family: "Unbounded", sans-serif; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--prata); font-weight: 600; }
.topo h1 { font-family: "Unbounded", sans-serif; margin: 2px 0 0; font-size: 21px; font-weight: 600; line-height: 1.2; }
.topo .sub { font-size: 13px; color: #b9bfd6; margin-top: 8px; }
.abas { display: flex; gap: 4px; background: var(--azul); padding: 0 16px; border-top: 1px solid rgba(255,255,255,.1); position: sticky; top: 0; z-index: 5; }
.abas a { color: #b9bfd6; text-decoration: none; font-size: 14px; font-weight: 600; letter-spacing: .03em; padding: 12px 14px 10px; border-bottom: 3px solid transparent; min-height: 44px; }
.abas a.on { color: var(--branco); border-bottom-color: var(--prata); }
.abas a:focus-visible { outline: 2px solid var(--prata); outline-offset: -2px; }
main { padding: 16px; max-width: 820px; margin: 0 auto; }
.resumo { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
.resumo.cinco .tile:last-child { grid-column: span 2; }
.tile { background: var(--branco); border: 1px solid var(--linha); border-radius: 8px; padding: 12px 12px 10px; min-width: 0; }
.tile b { display: block; font-family: "Unbounded", sans-serif; font-size: 20px; font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; }
.tile span { font-size: 11px; color: var(--tinta-2); letter-spacing: .06em; text-transform: uppercase; }
.tile em { display: block; font-style: normal; font-size: 12px; color: var(--tinta-2); margin-top: 4px; }
.tile.venda b { color: var(--verde); }
.periodo { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.chip { border: 1px solid var(--linha); background: var(--branco); border-radius: 999px; padding: 7px 12px; font-size: 14px; cursor: pointer; user-select: none; min-height: 38px; display: inline-flex; align-items: center; color: var(--tinta); font-family: inherit; }
.chip.on { background: var(--azul); color: var(--branco); border-color: var(--azul); }
.chip.venda.on { background: var(--verde); border-color: var(--verde); }
.busca { margin-bottom: 14px; }
.busca-linha { display: flex; gap: 8px; }
.taxa { font-size: 13px; color: var(--tinta-2); margin: -4px 0 14px; }
.botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { display: block; width: 100%; background: var(--azul); color: var(--branco); border: 0; border-radius: 8px; padding: 13px; font: inherit; font-weight: 600; font-size: 16px; cursor: pointer; min-height: 48px; }
.btn.verde { background: var(--verde); }
.btn.sec { background: transparent; color: var(--azul); border: 1px solid var(--azul); }
.btn.mau { background: transparent; color: var(--vermelho); border: 1px solid var(--vermelho); }
.btn:disabled { opacity: .6; }
.lista { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--branco); border: 1px solid var(--linha); border-radius: 8px; padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.item:focus-visible { outline: 2px solid var(--azul-logo); outline-offset: 2px; }
.item .nome { font-weight: 600; overflow-wrap: anywhere; }
.item .meta { font-size: 13px; color: var(--tinta-2); grid-column: 1; overflow-wrap: anywhere; }
.item .valor { font-weight: 600; color: var(--verde); text-align: right; }
.etapa { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; align-self: start; white-space: nowrap; }
.e-sem_resposta { background: #eef0f5; color: var(--tinta-2); }
.e-conversando { background: var(--azul-bg); color: var(--azul-logo); }
.e-orcamento { background: var(--laranja-bg); color: var(--laranja); }
.e-venda { background: var(--verde-bg); color: var(--verde); }
.e-perdido { background: var(--vermelho-bg); color: var(--vermelho); }
.vazio { color: var(--tinta-2); text-align: center; padding: 28px 10px; font-size: 14px; }
dialog { border: 0; border-radius: 12px 12px 0 0; padding: 0; width: 100%; max-width: 820px; margin: auto auto 0; background: var(--fundo); color: var(--tinta); }
dialog::backdrop { background: rgba(11, 18, 54, .55); }
.form { padding: 16px; max-height: 92vh; overflow: auto; }
.form h2 { margin: 0 0 6px; font-family: "Unbounded", sans-serif; font-size: 17px; font-weight: 600; }
label.l { display: block; font-size: 12px; color: var(--tinta-2); letter-spacing: .06em; text-transform: uppercase; margin: 14px 0 6px; font-weight: 600; }
input, textarea { width: 100%; font: inherit; font-size: 16px; padding: 12px; border: 1px solid var(--linha); border-radius: 8px; background: var(--branco); color: var(--tinta); min-height: 48px; }
input:focus-visible, textarea:focus-visible { outline: 2px solid var(--azul-logo); outline-offset: 1px; }
textarea { min-height: 72px; resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.acoes { display: flex; gap: 8px; margin-top: 18px; position: sticky; bottom: 0; background: var(--fundo); padding: 8px 0 4px; }
.acoes .btn { flex: 1; }
.aviso { font-size: 13px; color: var(--vermelho); margin-top: 8px; min-height: 18px; }
.gate { max-width: 420px; margin: 40px auto; }
.gate p { color: var(--tinta-2); font-size: 14px; }
.rodape { font-size: 12px; color: var(--tinta-2); text-align: center; margin: 28px 0 12px; }
.ori-ic { width: 16px; height: 16px; flex-shrink: 0; display: inline-block; vertical-align: -3px; margin-right: 6px; }
.ori { white-space: nowrap; }

.sec-t { font-family: "Unbounded", sans-serif; font-size: 16px; font-weight: 600; margin: 28px 0 4px; }
.sec-s { font-size: 14px; color: var(--tinta-2); margin: 0 0 12px; }
.caixa { background: var(--branco); border: 1px solid var(--linha); border-radius: 8px; padding: 14px; }
.caixa + .caixa { margin-top: 8px; }
.alerta { background: var(--laranja-bg); border: 1px solid #f1d39a; border-radius: 8px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; }
.alerta.mau { background: var(--vermelho-bg); border-color: #efc3bf; }
.alerta b { display: block; margin-bottom: 2px; }
.atualizado { font-size: 13px; color: var(--tinta-2); margin: 0 0 14px; }

.linha-num b { font-weight: 600; text-align: right; white-space: nowrap; }
.anuncio h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.anuncio .tag { font-size: 12px; color: var(--tinta-2); margin-bottom: 8px; }
.anuncio .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; font-size: 13px; }
.anuncio .nums div b { display: block; font-size: 15px; font-weight: 600; }
.anuncio .nums div span { color: var(--tinta-2); font-size: 12px; }
.anuncio .nota { font-size: 13px; color: var(--tinta-2); margin-top: 8px; }
figure.barras { margin: 0; }
figure.barras figcaption { font-size: 13px; color: var(--tinta-2); margin-bottom: 6px; }
figure.barras svg { width: 100%; height: auto; display: block; }
.tab-dias { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
.tab-dias th, .tab-dias td { padding: 6px 4px; border-bottom: 1px solid var(--linha); text-align: right; }
.tab-dias th:first-child, .tab-dias td:first-child { text-align: left; }
.tab-dias th { color: var(--tinta-2); font-weight: 600; font-size: 12px; }
.conc h4 { margin: 0 0 6px; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--tinta-2); }
.conc ul { margin: 0; padding-left: 18px; font-size: 14px; }
.conc li + li { margin-top: 4px; }
.etapas-bar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: #eef0f5; margin: 8px 0 10px; }
.etapas-bar span { display: block; height: 100%; }
details.glos summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
details.glos p { font-size: 14px; margin: 6px 0; }
@media (min-width: 620px) {
  .resumo { grid-template-columns: repeat(4, 1fr); }
  .resumo.cinco { grid-template-columns: repeat(5, 1fr); }
  .resumo.cinco .tile:last-child { grid-column: auto; }
  dialog { border-radius: 12px; margin: auto; }
}

  function carregar() {

  // ---------- Aba Contatos ----------

  function filtrados() {

  }

  function renderContatos(caret) {

    if (!L.length) html += busca.trim() ? '<div class="vazio">Nada encontrado. Tenta outro termo ou escolhe Tudo no período.</div>' : '<div class="vazio">Toca em “+ Contato” quando chegar alguém, ou em “+ Venda” quando fechar.</div>';

  function aviso(m) { var el = document.getElementById("aviso"); if (el) el.textContent = m; }

  // ---------- Aba Anúncios ----------
  function barras(serie, chave, formato, cor, titulo) {
    if (!serie.length) return "";
    var W = 320, H = 120, top = 12, base = H - 18, max = Math.max.apply(null, serie.map(function (s) { return s[chave]; }).concat([1]));
    var bw = Math.max(4, Math.min(28, (W - 8) / serie.length - 4));
    var passo = (W - 8) / serie.length;
    var g = serie.map(function (s, i) {
      var v = s[chave], hgt = Math.round((base - top) * v / max), x = 4 + i * passo + (passo - bw) / 2;
      return '<rect x="' + x.toFixed(1) + '" y="' + (base - hgt) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(hgt, v > 0 ? 2 : 0) + '" rx="2" fill="' + cor + '"><title>' + h(dataBr(s.d) + ": " + formato(v)) + "</title></rect>" +
        (serie.length <= 16 ? '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 4) + '" font-size="9" text-anchor="middle" fill="#4c5373">' + h(s.d.slice(8, 10)) + "</text>" : "");
    }).join("");
    return '<figure class="barras"><figcaption>' + h(titulo) + '</figcaption><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + h(titulo) + '. A tabela abaixo traz os valores dia a dia.">' + '<line x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '" stroke="#e2e5ee"/>' + g + "</svg></figure>";
  }

  function renderAnuncios() {
    marcaAba();
    var html = "";
    if (!foto || !foto.dados) {
      app.innerHTML = '<div class="vazio">Os números dos anúncios ainda não foram carregados. A Anvil atualiza esta aba.</div>';
      return;
    }
    var D = foto.dados;
    var gerado = new Date(foto.gerado_em);
    var anuncios = D.anuncios || [], dias = (D.dias || []).map(function (x) { return { d: x[0], g: Number(x[1] || 0), c: Number(x[2] || 0) }; });
    var gasto = Number(D.gasto_total || 0), conversas = Number(D.conversas_total || 0);
    var custo = conversas ? gasto / conversas : null;
    var desde = D.periodo && D.periodo.de ? D.periodo.de : (dias[0] ? dias[0].d : "");

    // Contatos do funil no mesmo período dos anúncios
    var noPer = contatos.filter(function (c) { return !desde || c.data_contato >= desde; });
    var pagos = noPer.filter(function (c) { return ORIGENS_PAGAS.indexOf(c.origem) >= 0; });
    var vendasPagas = pagos.filter(function (c) { return c.etapa === "venda"; });
    var valorPago = vendasPagas.reduce(function (s, c) { return s + Number(c.valor || 0); }, 0);
    var vendasTodas = noPer.filter(function (c) { return c.etapa === "venda"; });
    var valorTodas = vendasTodas.reduce(function (s, c) { return s + Number(c.valor || 0); }, 0);
    var doAnuncio = noPer.filter(function (c) { return c.origem === "anuncio_meta"; });

    html += '<p class="atualizado">Números do Facebook e Instagram de ' + h(dataBr(desde)) + " até " + gerado.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) + ". Vendas: o que a equipe lançou na aba Contatos.</p>";

    if (D.saldo && D.saldo.alerta) html += '<div class="alerta' + (D.saldo.grave ? " mau" : "") + '"><b>' + h(D.saldo.titulo || "Atenção ao saldo") + "</b>" + h(D.saldo.alerta) + "</div>";

    html += '<div class="resumo"><div class="tile"><b>' + brl0(gasto) + '</b><span>Gasto em anúncios</span></div><div class="tile"><b>' + num(conversas) + '</b><span>Conversas no WhatsApp</span></div><div class="tile"><b>' + (custo != null ? brl(custo) : "sem dado") + '</b><span>Custo por conversa</span></div><div class="tile venda"><b>' + brl0(valorPago) + "</b><span>" + (vendasPagas.length === 1 ? "1 venda do tráfego pago" : vendasPagas.length + " vendas do tráfego pago") + "</span><em>" + (gasto && valorPago ? "R$ " + (valorPago / gasto).toFixed(2).replace(".", ",") + " para cada R$ 1 investido" : "Ainda sem venda lançada") + "</em></div></div>";

    // Conversas x contatos lançados
    var faltam = Math.max(0, conversas - doAnuncio.length);
    html += '<h2 class="sec-t">Quem chamou pelos anúncios</h2><p class="sec-s">O Facebook conta as conversas que começaram. A aba Contatos mostra o que aconteceu com cada uma.</p><div class="caixa">';
    html += '<div class="linha-num"><span>Conversas que o Facebook contou</span><b>' + num(conversas) + '</b></div><div class="linha-num"><span>Contatos de anúncio lançados no funil</span><b>' + num(doAnuncio.length) + "</b></div>";
    if (doAnuncio.length) {
      var porEt = {}; doAnuncio.forEach(function (c) { porEt[c.etapa] = (porEt[c.etapa] || 0) + 1; });
      html += '<div class="etapas-bar" aria-hidden="true">' + Object.keys(ETAPAS).map(function (k) { return porEt[k] ? '<span style="width:' + (porEt[k] / doAnuncio.length * 100).toFixed(1) + "%;background:" + COR_ETAPA[k] + '"></span>' : ""; }).join("") + "</div>";
      html += Object.keys(ETAPAS).filter(function (k) { return porEt[k]; }).map(function (k) { return '<div class="linha-num"><span>' + h(ETAPAS[k]) + "</span><b>" + porEt[k] + "</b></div>"; }).join("");
    }
    if (faltam > 0) html += '<p class="sec-s" style="margin:10px 0 0">' + (faltam === 1 ? "Falta" : "Faltam") + " <b>" + faltam + "</b> " + (faltam === 1 ? "conversa" : "conversas") + " para lançar. Sem isso não dá para saber se o anúncio vende.</p>";
    html += "</div>";

    // Dia a dia
    if (dias.length) {
      html += '<h2 class="sec-t">Dia a dia</h2><div class="caixa">' + barras(dias, "g", brl, "#283475", "Quanto gastou por dia (R$)") + '<div style="height:12px"></div>' + barras(dias, "c", function (v) { return num(v) + " conversas"; }, "#1a8f4c", "Conversas que chegaram por dia");
      html += '<table class="tab-dias"><thead><tr><th scope="col">Dia</th><th scope="col">Gasto</th><th scope="col">Conversas</th></tr></thead><tbody>' + dias.slice().reverse().map(function (s) { return "<tr><td>" + dataBr(s.d) + "</td><td>" + brl(s.g) + "</td><td>" + num(s.c) + "</td></tr>"; }).join("") + "</tbody></table></div>";
    }

    // Por frente

        var g = ads.reduce(function (s, a) { return s + Number(a.gasto || 0); }, 0), cv = ads.reduce(function (s, a) { return s + Number(a.conversas || 0); }, 0);
        html += '<div class="caixa"><div class="anuncio"><h3>' + h(fr.nome) + '</h3><div class="tag">' + h(fr.publico || "") + (fr.orcamento_dia ? " · " + brl0(fr.orcamento_dia) + " por dia" : "") + '</div><div class="nums"><div><b>' + brl(g) + "</b><span>gasto</span></div><div><b>" + num(cv) + "</b><span>" + (cv === 1 ? "conversa" : "conversas") + "</span></div><div><b>" + (cv ? brl(g / cv) : "·") + "</b><span>por conversa</span></div></div></div></div>";
      });
    }

    // Cada anúncio
    if (anuncios.length) {
      html += '<h2 class="sec-t">Cada anúncio</h2><p class="sec-s">Anúncio com menos de 5 conversas ainda não diz se é bom ou ruim.</p>';
      anuncios.slice().sort(function (a, b) { return (b.conversas - a.conversas) || (b.gasto - a.gasto); }).forEach(function (a) {
        html += '<div class="caixa anuncio"><h3>' + h(a.nome) + '</h3><div class="tag">' + h((FRENTES[a.frente] || a.frente || "") + (a.situacao ? " · " + a.situacao : "")) + '</div><div class="nums"><div><b>' + brl(a.gasto) + "</b><span>gasto</span></div><div><b>" + num(a.conversas) + "</b><span>" + (a.conversas === 1 ? "conversa" : "conversas") + "</span></div><div><b>" + num(a.impressoes) + "</b><span>vezes na tela</span></div><div><b>" + num(a.alcance) + "</b><span>pessoas</span></div><div><b>" + num(a.cliques) + "</b><span>cliques</span></div>" + (a.video ? "<div><b>" + num(a.video) + "</b><span>viram o vídeo</span></div>" : "") + "</div>" + (a.nota ? '<div class="nota">' + h(a.nota) + "</div>" : "") + "</div>";
      });
    }

    // De onde vieram as vendas
    html += '<h2 class="sec-t">De onde vieram as vendas</h2><p class="sec-s">Desde ' + h(dataBr(desde)) + ", pelo que foi lançado no funil. Valor vendido, não lucro.</p><div class=\"caixa\">";
    if (!vendasTodas.length) html += '<div class="vazio" style="padding:12px">Nenhuma venda lançada ainda. Fechou? Toca em “+ Venda” na aba Contatos.</div>';
    else Object.keys(ORIGENS).forEach(function (o) {
      var vs = vendasTodas.filter(function (c) { return c.origem === o; }); if (!vs.length) return;
      html += '<div class="linha-num"><span class="ori">' + icone(o) + h(ORIGENS_CURTO[o]) + " · " + vs.length + (vs.length === 1 ? " venda" : " vendas") + "</span><b>" + brl(vs.reduce(function (s, c) { return s + Number(c.valor || 0); }, 0)) + "</b></div>";
    });
    if (vendasTodas.length) html += '<div class="linha-num"><span><b>Total</b></span><b>' + brl(valorTodas) + "</b></div>";
    html += "</div>";

    // Mercado Livre
    if (D.ml) {
      var M = D.ml;
      html += '<h2 class="sec-t">Anúncios no Mercado Livre</h2><p class="sec-s">' + h(M.periodo || "") + ". Números do próprio Mercado Livre: venda atribuída é quem clicou no anúncio e comprou.</p>";
      html += '<div class="resumo"><div class="tile"><b>' + brl0(M.investimento) + '</b><span>Investido</span></div><div class="tile venda"><b>' + num(M.vendas) + '</b><span>Vendas pelos anúncios</span></div><div class="tile venda"><b>' + brl0(M.receita) + '</b><span>Receita dessas vendas</span></div><div class="tile"><b>' + h(String(M.roas || "").replace(".", ",")) + 'x</b><span>Retorno</span></div></div>';
      (M.campanhas || []).forEach(function (cp) {
        html += '<div class="caixa anuncio"><h3>' + h(cp.nome) + '</h3><div class="tag">' + (cp.orcamento_dia ? brl0(cp.orcamento_dia) + " por dia" : "") + (cp.situacao ? " · " + h(cp.situacao) : "") + '</div><div class="nums"><div><b>' + brl(cp.investimento) + "</b><span>investido</span></div><div><b>" + num(cp.vendas) + "</b><span>vendas</span></div><div><b>" + (cp.roas != null ? h(String(cp.roas).replace(".", ",")) + "x" : "·") + "</b><span>retorno</span></div></div></div>";
      });
    }

    // Conclusões
    var N = D.notas || {};
    var blocos = [["comprovado", "Comprovado"], ["provavel", "Provável"], ["nao_sabemos", "Ainda não sabemos"], ["proximo", "Próximo passo"]];
    if (blocos.some(function (b) { return N[b[0]] && N[b[0]].length; })) {
      html += '<h2 class="sec-t">O que dá para concluir hoje</h2>';
      blocos.forEach(function (b) { if (N[b[0]] && N[b[0]].length) html += '<div class="caixa conc"><h4>' + b[1] + "</h4><ul>" + N[b[0]].map(function (t) { return "<li>" + h(t) + "</li>"; }).join("") + "</ul></div>"; });
    }

    html += '<h2 class="sec-t">O que cada número quer dizer</h2><div class="caixa"><details class="glos"><summary>Abrir explicação</summary>' +
      "<p><b>Conversa no WhatsApp:</b> pessoa que tocou no anúncio e mandou mensagem. O Facebook conta, mas não sabe se virou venda: isso só aparece quando a equipe lança no funil.</p>" +
      "<p><b>Custo por conversa:</b> gasto dividido pelas conversas.</p>" +
      "<p><b>Vezes na tela:</b> quantas vezes o anúncio apareceu. <b>Pessoas:</b> quantas pessoas diferentes viram.</p>" +
      "<p><b>Tráfego pago:</b> contatos que chegaram pelo anúncio, pelo Google Ads ou pelo site, porque as visitas do site vêm dos anúncios.</p>" +
      "<p><b>Para cada R$ 1 investido:</b> valor das vendas do tráfego pago dividido pelo gasto. É faturamento, não lucro.</p></details></div>";
    html += '<div class="rodape">Porto Balanças · acompanhamento Anvil</div>';
    app.innerHTML = html;
  }

  window.addEventListener("hashchange", function () { if (dlg.open) dlg.close(); carregar(); });
  carregar();
})();
</script>
</body>
</html>
